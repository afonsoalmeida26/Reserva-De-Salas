<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva de Salas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #4B5563;
    --paper: #F6F1E7;
    --paper-dim: #EAE2D0;
    --gold: #C99A3B;
    --gold-deep: #A87C24;
    --teal: #2F6F63;
    --rust: #B4472C;
    --line: rgba(27, 36, 48, 0.16);
    --shadow: 0 18px 40px -20px rgba(27, 36, 48, 0.45);
  }

  * { box-sizing: border-box; }

  #root {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,154,59,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(47,111,99,0.14), transparent 45%);
    min-height: 100vh;
    color: var(--paper);
    padding: clamp(20px, 5vw, 56px);
  }

  h1, h2, h3, .display {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  a, button { font-family: inherit; }

  /* ---------- top bar ---------- */
  .topbar {
    max-width: 980px;
    margin: 0 auto 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand-mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 3px 7px;
    border-radius: 3px;
  }
  .brand h1 { font-size: 22px; margin: 0; }
  .brand-sub { color: rgba(246,241,231,0.55); font-size: 13px; }

  .who {
    font-size: 13px;
    color: rgba(246,241,231,0.7);
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .gear-btn {
    background: none; border: 1px solid rgba(246,241,231,0.25);
    color: var(--paper); border-radius: 7px; padding: 7px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .gear-btn:hover { border-color: var(--gold); background: rgba(201,154,59,0.12); }
  .gear-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--paper);
    color: var(--ink);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 6px;
    min-width: 190px;
    z-index: 20;
  }
  .gear-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 10px;
    font-size: 13px;
    color: var(--ink);
    border-radius: 6px;
    cursor: pointer;
  }
  .gear-menu button:hover { background: var(--paper-dim); }
  .gear-menu button.danger { color: var(--rust); }
  .link-btn {
    background: none; border: none; color: var(--gold);
    cursor: pointer; font-size: 13px; text-decoration: underline;
    text-underline-offset: 3px; padding: 2px;
  }
  .link-btn:hover { color: #E4BE6D; }
  .link-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  /* ---------- shell ---------- */
  .shell { max-width: 980px; margin: 0 auto; }

  /* ---------- ticket / login card ---------- */
  .ticket-wrap { display: flex; justify-content: center; padding-top: 4vh; }
  .ticket {
    display: grid;
    grid-template-columns: 150px 1fr;
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    width: 100%;
    max-width: 560px;
  }
  @media (max-width: 520px) {
    .ticket { grid-template-columns: 1fr; }
    .ticket-stub { flex-direction: row !important; padding: 16px 20px !important; }
  }
  .ticket-stub {
    background: var(--ink);
    color: var(--paper);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 18px;
    position: relative;
  }
  .ticket-stub::after {
    content: "";
    position: absolute;
    right: -1px; top: 0; bottom: 0;
    border-right: 2px dashed rgba(246,241,231,0.35);
  }
  .stub-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--gold);
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  .stub-room {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    line-height: 1;
  }
  .ticket-body { padding: 30px 30px 26px; }
  .ticket-body .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold-deep); margin-bottom: 4px; display: block;
  }
  .ticket-body h2 { font-size: 26px; margin: 0 0 18px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; color: var(--ink-soft);
    margin-bottom: 5px; letter-spacing: 0.02em;
  }
  .field input, .field select {
    width: 100%;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 7px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .btn-primary {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
    margin-top: 4px;
  }
  .btn-primary:hover { background: #2a3648; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }

  .btn-ghost {
    width: 100%;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-ghost:hover { background: var(--paper-dim); }

  .switch-row {
    text-align: center; margin-top: 16px; font-size: 13px; color: var(--ink-soft);
  }
  .switch-row button {
    background: none; border: none; color: var(--gold-deep);
    font-weight: 600; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }

  .msg {
    font-size: 13px; padding: 9px 12px; border-radius: 7px; margin-bottom: 14px;
    border: 1px solid transparent;
  }
  .msg.err { background: rgba(180,71,44,0.08); border-color: rgba(180,71,44,0.35); color: #7c2f1c; }
  .msg.ok  { background: rgba(47,111,99,0.10); border-color: rgba(47,111,99,0.4); color: #1c453d; }

  /* ---------- app view ---------- */
  .grid2 {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 22px;
  }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 22px 22px 24px;
  }
  .panel h2 { font-size: 18px; margin: 0 0 4px; }
  .panel .sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }

  .sala-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    background: #fff;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .sala-card:hover { border-color: var(--gold-deep); }
  .sala-card.active { border-color: var(--gold-deep); background: #FBF3E1; }
  .sala-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    background: var(--ink);
    color: var(--gold);
    border-radius: 6px;
    padding: 4px 10px;
    min-width: 44px;
    text-align: center;
  }
  .sala-meta { flex: 1; }
  .sala-meta .name { font-weight: 600; font-size: 14.5px; }
  .sala-meta .cap { font-size: 12px; color: var(--ink-soft); }

  .booking-form { border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 16px; }

  .stamp {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 3px 9px;
    border: 1.5px dashed currentColor;
    border-radius: 4px;
    transform: rotate(-4deg);
  }
  .stamp.confirmada { color: var(--teal); }
  .stamp.cancelada { color: var(--rust); text-decoration: line-through; }

  .reserva-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line); gap: 10px;
    flex-wrap: wrap;
  }
  .reserva-row:last-child { border-bottom: none; }
  .reserva-info .room { font-weight: 600; font-size: 13.5px; }
  .reserva-info .time { font-size: 12px; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; }

  .cancel-btn {
    background: none; border: 1px solid var(--rust); color: var(--rust);
    font-size: 11.5px; border-radius: 6px; padding: 5px 9px; cursor: pointer;
  }
  .cancel-btn:hover { background: rgba(180,71,44,0.08); }

  .empty {
    text-align: center; color: var(--ink-soft); font-size: 13px;
    padding: 26px 10px; border: 1px dashed var(--line); border-radius: 10px;
  }

  /* settings */
  .settings-panel {
    max-width: 560px; margin: 0 auto; background: var(--paper); color: var(--ink);
    border-radius: 14px; box-shadow: var(--shadow); padding: 22px;
  }
  .settings-panel .field label { font-family: 'JetBrains Mono', monospace; }

  footer.note {
    text-align: center; color: rgba(246,241,231,0.4); font-size: 11.5px;
    margin-top: 30px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ------------------------------------------------------------------
// CONFIGURAÇÃO — endpoints reais do teu backend Flask.
// A autenticação é feita por COOKIE httponly (definido pelo próprio
// backend em /aluno/login e /aluno/novo), por isso todos os pedidos
// usam { credentials: "include" } em vez de um header Authorization.
// ------------------------------------------------------------------
const DEFAULT_CONFIG = {
  baseUrl: "https://reserva-de-salas.onrender.com",
  endpoints: {
    login: "/aluno/login",
    registo: "/aluno/novo",
    changePassword: "/aluno/change_password",
    logout: "/aluno/logout",
    me: "/aluno/me",
    salas: "/sala/listar_salas",
    criarSala: "/sala/nova_sala",
    removerSala: "/sala/remover_sala",
    criarReserva: "/reserva",
    minhasReservas: "/reserva/listar_reservas",
    todasReservas: "/reserva/proximas_reservas",
    cancelarReserva: "/reserva/cancelar_reserva",
    checkIn: "/reserva/check_in",
  },
};

async function apiFetch(config, path, { method = "GET", body } = {}) {
  let res;
  try {
    res = await fetch(config.baseUrl + path, {
      method,
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    // Falha de rede/CORS: o fetch nem chega a obter resposta.
    // Devolvemos um "erro normal" em vez de deixar a exceção escapar,
    // para a interface nunca ficar presa em "a carregar".
    return {
      ok: false,
      status: 0,
      data: {
        Result: "Não foi possível contactar o servidor (" + config.baseUrl + "). " +
                "Confirma que o Flask está a correr e que o CORS aceita esta origem.",
      },
    };
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}

function paraFormatoBackend(isoDate) {
  const [ano, mes, dia] = isoDate.split("-");
  return `${dia}-${mes}-${ano}`;
}

// Data de hoje no formato AAAA-MM-DD (o que os inputs type="date" esperam)
function hojeISO() {
  return new Date().toISOString().slice(0, 10);
}

// Converte "DD-MM-AAAA HH:MM" (formato devolvido pelo backend) para um objeto Date
function parseDataBackend(texto) {
  if (!texto) return null;
  const [dataParte, horaParte] = texto.split(" ");
  if (!dataParte || !horaParte) return null;
  const [dia, mes, ano] = dataParte.split("-");
  const [hora, minuto] = horaParte.split(":");
  return new Date(ano, mes - 1, dia, hora, minuto);
}

// Verifica se, neste momento, a hora atual está entre o início e o fim da reserva
function reservaADecorrer(inicioTexto, fimTexto) {
  const inicio = parseDataBackend(inicioTexto);
  const fim = parseDataBackend(fimTexto);
  if (!inicio || !fim) return false;
  const agora = new Date();
  return agora >= inicio && agora <= fim;
}

function GearIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
    </svg>
  );
}

function AuthView({ config, onAuthenticated }) {
  const [mode, setMode] = useState("login");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [ok, setOk] = useState("");

  const [loginForm, setLoginForm] = useState({ email: "", password: "" });
  const [regForm, setRegForm] = useState({
    nome: "", email: "", password: "", data_nasc: "",
  });

  const doLogin = async (e) => {
    e.preventDefault();
    setError(""); setOk(""); setLoading(true);
    const { ok: success, data } = await apiFetch(config, config.endpoints.login, {
      method: "POST", body: loginForm,
    });
    setLoading(false);
    if (success) {
      onAuthenticated(loginForm.email);
    } else {
      setError((data && data.Result) || "Não foi possível iniciar sessão.");
    }
  };

  const doRegisto = async (e) => {
    e.preventDefault();
    setError(""); setOk(""); setLoading(true);
    const { ok: success, data } = await apiFetch(config, config.endpoints.registo, {
      method: "PUT", body: regForm,
    });
    setLoading(false);
    if (success) {
      setOk("Conta criada com sucesso. A entrar...");
      setTimeout(() => onAuthenticated(regForm.email), 600);
    } else {
      setError((data && data.Result) || "Não foi possível criar a conta.");
    }
  };

  return (
    <div className="ticket-wrap">
      <div className="ticket">
        <div className="ticket-stub">
          <span className="stub-num">RESERVA · CAMPUS</span>
          <span className="stub-room">Nº 07</span>
        </div>
        <div className="ticket-body">
          <span className="eyebrow">{mode === "login" ? "Acesso" : "Nova conta"}</span>
          <h2>{mode === "login" ? "Entrar na tua conta" : "Criar conta de aluno"}</h2>

          {error && <div className="msg err">{error}</div>}
          {ok && <div className="msg ok">{ok}</div>}

          {mode === "login" ? (
            <form onSubmit={doLogin}>
              <div className="field">
                <label>Email</label>
                <input type="email" required value={loginForm.email}
                  onChange={e => setLoginForm(f => ({ ...f, email: e.target.value }))} />
              </div>
              <div className="field">
                <label>Palavra-passe</label>
                <input type="password" required value={loginForm.password}
                  onChange={e => setLoginForm(f => ({ ...f, password: e.target.value }))} />
              </div>
              <button className="btn-primary" disabled={loading}>
                {loading ? "A entrar..." : "Entrar"}
              </button>
            </form>
          ) : (
            <form onSubmit={doRegisto}>
              <div className="field">
                <label>Nome completo</label>
                <input required value={regForm.nome}
                  onChange={e => setRegForm(f => ({ ...f, nome: e.target.value }))} />
              </div>
              <div className="field">
                <label>Data nasc.</label>
                <input type="date" required value={regForm.data_nasc} max={hojeISO()}
                  onChange={e => setRegForm(f => ({ ...f, data_nasc: e.target.value }))} />
              </div>
              <div className="field">
                <label>Email</label>
                <input type="email" required value={regForm.email}
                  onChange={e => setRegForm(f => ({ ...f, email: e.target.value }))} />
              </div>
              <div className="field">
                <label>Palavra-passe</label>
                <input type="password" required value={regForm.password}
                  onChange={e => setRegForm(f => ({ ...f, password: e.target.value }))} />
              </div>
              <button className="btn-primary" disabled={loading}>
                {loading ? "A criar..." : "Criar conta"}
              </button>
            </form>
          )}

          <div className="switch-row">
            {mode === "login" ? (
              <>Ainda não tens conta? <button onClick={() => { setMode("registo"); setError(""); }}>Regista-te</button></>
            ) : (
              <>Já tens conta? <button onClick={() => { setMode("login"); setError(""); }}>Entrar</button></>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function AppView({ config, userEmail, userNome, onLogout, pwOpen, setPwOpen }) {
  const [salas, setSalas] = useState([]);
  const [reservas, setReservas] = useState([]);
  const [selectedSala, setSelectedSala] = useState(null);
  const [form, setForm] = useState({ data: "", hora_inicio: "", hora_fim: "" });
  const [msg, setMsg] = useState({ type: "", text: "" });
  const [loadingSalas, setLoadingSalas] = useState(true);
  const [submitting, setSubmitting] = useState(false);
  const [pwForm, setPwForm] = useState({ password: "" });
  const [pwMsg, setPwMsg] = useState("");
  const [checkingIn, setCheckingIn] = useState(null); // guarda o id_reserva em check-in, ou null
  const [reservasMsg, setReservasMsg] = useState({ type: "", text: "" });

  const loadSalas = useCallback(async () => {
    setLoadingSalas(true);
    const { ok, data } = await apiFetch(config, config.endpoints.salas);
    setSalas(ok && data && Array.isArray(data.Results) ? data.Results : []);
    setLoadingSalas(false);
  }, [config]);

  const loadReservas = useCallback(async () => {
    const { ok, data } = await apiFetch(config, config.endpoints.minhasReservas);
    setReservas(ok && data && Array.isArray(data.Results) ? data.Results : []);
  }, [config]);

  useEffect(() => { loadSalas(); loadReservas(); }, [loadSalas, loadReservas]);

  const submitReserva = async (e) => {
    e.preventDefault();
    if (!selectedSala) { setMsg({ type: "err", text: "Escolhe uma sala primeiro." }); return; }
    setSubmitting(true);
    setMsg({ type: "", text: "" });

    const body = {
      hora_inicio: form.hora_inicio,
      hora_fim: form.hora_fim,
      data_reserva: paraFormatoBackend(form.data),
    };
    const path = `${config.endpoints.criarReserva}/${selectedSala.numero_sala}`;
    const { ok, data } = await apiFetch(config, path, { method: "POST", body });

    setSubmitting(false);
    if (ok) {
      setMsg({ type: "ok", text: (data && data.Result) || "Reserva criada com sucesso." });
      setForm({ data: "", hora_inicio: "", hora_fim: "" });
      loadReservas();
    } else {
      setMsg({ type: "err", text: (data && (data.Result || data.Errors)) || "Não foi possível reservar." });
    }
  };

  const fazerCheckIn = async (idReserva) => {
    setCheckingIn(idReserva);
    setReservasMsg({ type: "", text: "" });

    const { ok, data } = await apiFetch(config, `${config.endpoints.checkIn}/${idReserva}`, {
      method: "PUT",
    });

    setCheckingIn(null);
    if (ok) {
      setReservasMsg({ type: "ok", text: (data && data.Result) || "Check-in efetuado com sucesso." });
      loadReservas();
    } else {
      setReservasMsg({ type: "err", text: (data && (data.Result || data.Errors)) || "Não foi possível fazer check-in." });
    }
  };

  const cancelarMinhaReserva = async (idReserva) => {
    setCheckingIn(idReserva); // reutiliza o mesmo indicador de "a processar" desta reserva
    setReservasMsg({ type: "", text: "" });

    const { ok, data } = await apiFetch(config, `${config.endpoints.cancelarReserva}/${idReserva}`, {
      method: "PUT",
    });

    setCheckingIn(null);
    if (ok) {
      setReservasMsg({ type: "ok", text: (data && data.Result) || "Reserva cancelada com sucesso." });
      loadReservas();
    } else {
      setReservasMsg({ type: "err", text: (data && (data.Result || data.Errors)) || "Não foi possível cancelar a reserva." });
    }
  };

  const submitChangePassword = async (e) => {
    e.preventDefault();
    setPwMsg("");
    const { ok, data } = await apiFetch(config, config.endpoints.changePassword, {
      method: "PUT", body: pwForm,
    });
    setPwMsg((data && data.Result) || (ok ? "Palavra-passe alterada." : "Erro."));
    if (ok) setPwForm({ password: "" });
  };

  return (
    <div>
      <h2 className="display" style={{ color: "var(--paper)", fontSize: 22, marginBottom: 18 }}>
        Olá {userNome || "aluno"}, que sala vai reservar?
      </h2>
      <div className="grid2">
      <div className="panel">
        <h2>Salas disponíveis</h2>
        <p className="sub">Escolhe uma sala e define o horário pretendido.</p>

        {loadingSalas && <div className="empty">A carregar salas...</div>}
        {!loadingSalas && salas.length === 0 && (
          <div className="empty">Sem salas para mostrar.</div>
        )}
        {salas.map((s, i) => {
          const active = selectedSala && selectedSala.id_sala === s.id_sala;
          return (
            <div key={s.id_sala ?? i}
                 className={"sala-card" + (active ? " active" : "")}
                 onClick={() => setSelectedSala(s)}>
              <span className="sala-id">{s.numero_sala}</span>
              <div className="sala-meta">
                <div className="name">Sala {s.numero_sala}</div>
              </div>
              {active && <span className="stamp confirmada">Selecionada</span>}
            </div>
          );
        })}

        <div className="booking-form">
          <h2 style={{ fontSize: 15 }}>Nova reserva</h2>
          {msg.text && <div className={"msg " + (msg.type === "err" ? "err" : "ok")}>{msg.text}</div>}
          <form onSubmit={submitReserva}>
            <div className="field">
              <label>Data</label>
              <input type="date" required value={form.data} min={hojeISO()}
                onChange={e => setForm(f => ({ ...f, data: e.target.value }))} />
            </div>
            <div className="field-row">
              <div className="field">
                <label>Início</label>
                <input type="time" required value={form.hora_inicio}
                  onChange={e => setForm(f => ({ ...f, hora_inicio: e.target.value }))} />
              </div>
              <div className="field">
                <label>Fim</label>
                <input type="time" required value={form.hora_fim}
                  onChange={e => setForm(f => ({ ...f, hora_fim: e.target.value }))} />
              </div>
            </div>
            <button className="btn-primary" disabled={submitting}>
              {submitting ? "A reservar..." : "Confirmar reserva"}
            </button>
          </form>
        </div>
      </div>

      <div className="panel">
        <h2>As minhas reservas</h2>
        <p className="sub">Reservas dos próximos 30 dias.</p>

        {reservasMsg.text && (
          <div className={"msg " + (reservasMsg.type === "err" ? "err" : "ok")}>{reservasMsg.text}</div>
        )}

        {reservas.length === 0 && <div className="empty">Ainda não tens reservas.</div>}
        {reservas.map((r, i) => {
          const estadoNorm = (r["Estado"] || "").toLowerCase();
          const cancelada = estadoNorm.startsWith("cancel");
          const jaFezCheckIn = estadoNorm.includes("check-in");
          const aDecorrer = reservaADecorrer(r["Inicio Reserva"], r["Fim Reserva"]);
          const idReserva = r["ID RESERVA"];
          const aFazerCheckIn = checkingIn === idReserva;
          return (
            <div className="reserva-row" key={idReserva ?? i}>
              <div className="reserva-info">
                <div className="room">Sala {r["Número Sala"]}</div>
                <div className="time">{r["Inicio Reserva"]} → {r["Fim Reserva"]}</div>
              </div>
              <span className={"stamp " + (cancelada ? "cancelada" : "confirmada")}>
                {r["Estado"]}
              </span>
              {!cancelada && !jaFezCheckIn && !aDecorrer && idReserva && (
                <button className="btn-ghost" style={{ width: "auto", marginTop: 0, padding: "6px 10px", fontSize: 12 }}
                  disabled={aFazerCheckIn}
                  onClick={() => fazerCheckIn(idReserva)}>
                  {aFazerCheckIn ? "A confirmar..." : "Confirmar presença"}
                </button>
              )}
              {!cancelada && !jaFezCheckIn && !aDecorrer && idReserva && (
                <button className="cancel-btn"
                  disabled={aFazerCheckIn}
                  onClick={() => cancelarMinhaReserva(idReserva)}>
                  {aFazerCheckIn ? "A cancelar..." : "Cancelar"}
                </button>
              )}
            </div>
          );
        })}
        <div className="booking-form">
          {pwOpen && (
            <form onSubmit={submitChangePassword}>
              <h2 style={{ fontSize: 15, marginBottom: 10 }}>Alterar palavra-passe</h2>
              {pwMsg && <div className="msg ok">{pwMsg}</div>}
              <div className="field">
                <label>Nova palavra-passe</label>
                <input type="password" required value={pwForm.password}
                  onChange={e => setPwForm({ password: e.target.value })} />
              </div>
              <button className="btn-primary">Guardar nova palavra-passe</button>
            </form>
          )}
        </div>
      </div>
      </div>
    </div>
  );
}

function AdminPanel({ config }) {
  const [salas, setSalas] = useState([]);
  const [loadingSalas, setLoadingSalas] = useState(true);
  const [novoNumero, setNovoNumero] = useState("");
  const [criando, setCriando] = useState(false);
  const [removendoId, setRemovendoId] = useState(null);
  const [msg, setMsg] = useState({ type: "", text: "" });
  const [reservas, setReservas] = useState([]);
  const [loadingReservas, setLoadingReservas] = useState(true);
  const [cancelandoId, setCancelandoId] = useState(null);
  const [reservasMsg, setReservasMsg] = useState({ type: "", text: "" });

  const loadTodasReservas = useCallback(async () => {
    setLoadingReservas(true);
    const { ok, data } = await apiFetch(config, config.endpoints.todasReservas);
    setReservas(ok && data && Array.isArray(data.Result) ? data.Result : []);
    setLoadingReservas(false);
  }, [config]);

  useEffect(() => { loadTodasReservas(); }, [loadTodasReservas]);

  const cancelarReservaAdmin = async (idReserva) => {
    setCancelandoId(idReserva);
    setReservasMsg({ type: "", text: "" });

    const { ok, data } = await apiFetch(config, `${config.endpoints.cancelarReserva}/${idReserva}`, {
      method: "PUT",
    });

    setCancelandoId(null);
    if (ok) {
      setReservasMsg({ type: "ok", text: (data && data.Result) || "Reserva cancelada com sucesso." });
      loadTodasReservas();
    } else {
      setReservasMsg({ type: "err", text: (data && (data.Result || data.Errors)) || "Não foi possível cancelar a reserva." });
    }
  };

  const loadSalas = useCallback(async () => {
    setLoadingSalas(true);
    const { ok, data } = await apiFetch(config, config.endpoints.salas);
    setSalas(ok && data && Array.isArray(data.Results) ? data.Results : []);
    setLoadingSalas(false);
  }, [config]);

  useEffect(() => { loadSalas(); }, [loadSalas]);

  const criarSala = async (e) => {
    e.preventDefault();
    if (!novoNumero) return;
    setCriando(true);
    setMsg({ type: "", text: "" });

    const { ok, data } = await apiFetch(config, `${config.endpoints.criarSala}/${novoNumero}`, {
      method: "POST",
    });

    setCriando(false);
    if (ok) {
      setMsg({ type: "ok", text: (data && data.Result) || "Sala criada com sucesso." });
      setNovoNumero("");
      loadSalas();
    } else {
      setMsg({ type: "err", text: (data && (data.Result || data.Errors)) || "Não foi possível criar a sala." });
    }
  };

  const removerSala = async (numeroSala) => {
    setRemovendoId(numeroSala);
    setMsg({ type: "", text: "" });

    const { ok, data } = await apiFetch(config, `${config.endpoints.removerSala}/${numeroSala}`, {
      method: "DELETE",
    });

    setRemovendoId(null);
    if (ok) {
      setMsg({ type: "ok", text: (data && data.Result) || "Sala removida com sucesso." });
      loadSalas();
    } else {
      setMsg({ type: "err", text: (data && (data.Result || data.Errors)) || "Não foi possível remover a sala." });
    }
  };

  return (
    <div className="panel" style={{ marginTop: 22 }}>
      <span className="eyebrow">Administração</span>
      <h2>Gestão de salas</h2>
      <p className="sub">Criar, remover salas e correr a verificação de faltas.</p>

      {msg.text && <div className={"msg " + (msg.type === "err" ? "err" : "ok")}>{msg.text}</div>}

      <form onSubmit={criarSala} className="field-row" style={{ alignItems: "flex-end", marginBottom: 18 }}>
        <div className="field" style={{ marginBottom: 0 }}>
          <label>Número da nova sala</label>
          <input value={novoNumero} onChange={e => setNovoNumero(e.target.value)}
            placeholder="ex: 305" required />
        </div>
        <button className="btn-primary" style={{ width: "auto", marginTop: 0 }} disabled={criando}>
          {criando ? "A criar..." : "Criar sala"}
        </button>
      </form>

      {loadingSalas && <div className="empty">A carregar salas...</div>}
      {!loadingSalas && salas.length === 0 && <div className="empty">Ainda não há salas registadas.</div>}
      {salas.map((s, i) => (
        <div className="sala-card" key={s.id_sala ?? i} style={{ cursor: "default" }}>
          <span className="sala-id">{s.numero_sala}</span>
          <div className="sala-meta">
            <div className="name">Sala {s.numero_sala}</div>
          </div>
          <button className="cancel-btn" disabled={removendoId === s.numero_sala}
            onClick={() => removerSala(s.numero_sala)}>
            {removendoId === s.numero_sala ? "A remover..." : "Remover"}
          </button>
        </div>
      ))}

      <div className="booking-form">
        <h2 style={{ fontSize: 15 }}>Todas as reservas (próximos 90 dias)</h2>

        {reservasMsg.text && (
          <div className={"msg " + (reservasMsg.type === "err" ? "err" : "ok")}>{reservasMsg.text}</div>
        )}

        {loadingReservas && <div className="empty">A carregar reservas...</div>}
        {!loadingReservas && reservas.length === 0 && <div className="empty">Não há reservas futuras.</div>}
        {reservas.map((r, i) => {
          const estadoNorm = (r["ESTADO"] || "").toLowerCase();
          const cancelada = estadoNorm.startsWith("cancel");
          const jaFezCheckIn = estadoNorm.includes("check-in");
          const aDecorrer = reservaADecorrer(r["INICIO"], r["FIM"]);
          const idReserva = r["ID RESERVA"];
          const aCancelar = cancelandoId === idReserva;
          return (
            <div className="reserva-row" key={idReserva ?? i}>
              <div className="reserva-info">
                <div className="room">Sala {r["SALA"]} · {r["NOME ALUNO"]}</div>
                <div className="time">{r["INICIO"]} → {r["FIM"]}</div>
              </div>
              <span className={"stamp " + (cancelada ? "cancelada" : "confirmada")}>
                {r["ESTADO"]}
              </span>
              {!cancelada && !jaFezCheckIn && !aDecorrer && idReserva && (
                <button className="cancel-btn" disabled={aCancelar}
                  onClick={() => cancelarReservaAdmin(idReserva)}>
                  {aCancelar ? "A cancelar..." : "Cancelar"}
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("auth");
  const [userEmail, setUserEmail] = useState(null);
  const [userNome, setUserNome] = useState(null);
  const [userTipo, setUserTipo] = useState(null);
  const [pwOpen, setPwOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const config = DEFAULT_CONFIG;

  const handleAuthenticated = async (email) => {
    setUserEmail(email);
    setView("app");

    // Vai buscar o nome e o tipo de utilizador (aluno/admin) através do cookie já definido pelo login
    const { ok, data } = await apiFetch(config, config.endpoints.me);
    if (ok && data && data.Result) {
      setUserTipo(data.Result.tipo || null);
      setUserNome(data.Result.nome || null);
    }
  };

  const handleLogout = async () => {
    try { await apiFetch(config, config.endpoints.logout, { method: "POST" }); }
    catch (e) {}
    setUserEmail(null);
    setUserNome(null);
    setUserTipo(null);
    setPwOpen(false);
    setView("auth");
  };

  return (
    <div className="shell">
      <div className="topbar">
        <div className="brand">
          <span className="brand-mark">RS·07</span>
          <div>
            <h1>Reserva de Salas</h1>
            <div className="brand-sub">Sistema de marcação de salas de aula</div>
          </div>
        </div>
        {userEmail && (
          <div className="who">
            <button className="gear-btn" onClick={() => setMenuOpen(o => !o)}
              title="Definições da conta" aria-label="Definições da conta">
              <GearIcon />
            </button>
            {menuOpen && (
              <div className="gear-menu">
                <button onClick={() => { setPwOpen(o => !o); setMenuOpen(false); }}>
                  Alterar palavra-passe
                </button>
                <button className="danger" onClick={() => { setMenuOpen(false); handleLogout(); }}>
                  Terminar sessão
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      {view === "auth" && (
        <AuthView config={config} onAuthenticated={handleAuthenticated} />
      )}
      {view === "app" && userEmail && (
        <React.Fragment>
          <AppView config={config} userEmail={userEmail} userNome={userNome} onLogout={handleLogout}
            pwOpen={pwOpen} setPwOpen={setPwOpen} />
          {userTipo === "admin" && <AdminPanel config={config} />}
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
